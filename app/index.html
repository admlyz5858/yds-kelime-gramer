<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f1f3f5">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Kelimetre</title>
  <script>
    /* Önbellek/eski sürüm sorununu kökten önle: her açılışta SW'leri kaldır, cache temizle */
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
    }
    if (window.caches) { caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {}); }
  </script>
  <link rel="stylesheet" href="css/style.css?v=66">
</head>
<body>
  <header id="ust-bar">
    <button id="geri" hidden>‹ Geri</button>
    <h1 id="baslik">Üniteler</h1>
    <div id="ust-aksiyon">
      <button id="yardimBtn" class="ust-ikon" aria-label="Nasıl çalışılır">?</button>
      <button id="ayarBtn" class="ust-ikon" aria-label="Ayarlar">⚙</button>
    </div>
  </header>
  <main id="icerik"></main>
  <nav id="sekme-bar">
    <button data-sekme="bugun" class="aktif"><span class="nav-ikon">🏠</span><span class="nav-etiket">Bugün</span></button>
    <button data-sekme="kelimeler"><span class="nav-ikon">📖</span><span class="nav-etiket">Kelimeler</span></button>
    <button data-sekme="mufredat"><span class="nav-ikon">🎓</span><span class="nav-etiket">Müfredat</span></button>
    <button data-sekme="oyun"><span class="nav-ikon">🧩</span><span class="nav-etiket">Oyun</span></button>
    <button data-sekme="ben"><span class="nav-ikon">👤</span><span class="nav-etiket">Ben</span></button>
  </nav>
  <script type="module" src="js/app.js?v=66"></script>
</body>
</html>
